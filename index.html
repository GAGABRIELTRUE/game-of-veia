<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="styles/style.css"/>
  <!-- CDN estável do Tailwind v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <!-- Configurações de cores limpas para evitar que o layout quebre -->
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    
    :root {
      --fundo: #f4f4f5; /* Modo claro */
      --card-bg: #ffffff;
      --card-300: #e4e4e7;
      --borda: #d4d4d8;
      --texto: #0a0a0a;
    }
    
    .dark {
      --fundo: rgb(10,10,10); /* Suas cores escuras originais */
      --card-bg: #000000;
      --card-300: #1c1c1e;
      --borda: #ffffff;
      --texto: #ffffff;
    }
  </style>
  
  <title>Game of veia online</title>
</head>
<body class="bg-[var(--fundo)] flex flex-col items-center justify-center p-4 m-0 min-h-screen w-full transition-colors duration-200">
  
    <!-- Botão de Alternar Tema -->
    <button id="toggle-tema" class="absolute top-4 right-4 p-2 rounded-full border border-zinc-400 dark:border-zinc-700 bg-[var(--card-bg)] text-[var(--texto)] font-bold text-sm cursor-pointer shadow-md hover:scale-105 transition">
      ☀️ Modo Claro
    </button>

    <!-- Tela inicial -->
    <div id="tela-inicial" class="w-4/5 text-[var(--texto)] flex flex-col gap-5 bg-[var(--card-bg)] p-5 rounded-2xl max-w-md shadow-xl border border-zinc-300 dark:border-zinc-800">
      <h2 class="text-xl font-bold text-center">Entrar em um jogo</h2>
      <p class="text-zinc-500 dark:text-gray-300 text-sm">Digite a sala do seu jogo:</p>
      <input id="sala" class="p-3 border border-zinc-400 dark:border-white rounded-xl outline-none focus:border-2 focus:border-blue-500 text-center font-bold bg-[var(--card-bg)] text-[var(--texto)]" type="text" placeholder="Ex: futebol, sala123, etc.">
      <button id="sala-botao" class="font-bold bg-blue-600 text-white p-3 rounded-xl hover:bg-blue-700 transition cursor-pointer">Entrar na sala</button>
    </div>
    
    <!-- Conteúdo do Jogo -->
    <div id="jogo-interface" class="hidden flex-1 w-full flex flex-col justify-start items-center bg-[var(--card-bg)] text-[var(--texto)] border border-zinc-300 dark:border-zinc-800 rounded-2xl p-6 max-h-[90dvh] max-w-md shadow-xl">
      
      <h1 class="font-bold text-5xl mb-1">Game of veia</h1>
      <!-- Exibe o ID da conversa atual -->
      <span class="text-sm font-semibold mb-4 bg-[var(--card-300)] px-3 py-1 rounded-full">Sala: <span id="nomeSala">...</span></span>
      <span id="status-seu-simbolo" class="text-sm text-yellow-600 dark:text-yellow-400 mb-4 font-bold h-5"></span>
      
      <div class="w-full flex-1 flex flex-col gap-3 aspect-square max-w-[350px]">
          <!-- Grid do Tabuleiro baseado na sua estrutura -->
          <div class="w-full h-full bg-[var(--card-300)] m-0 rounded-md flex flex-col justify-between p-2">
            <!-- Linha 1 -->
            <div class="w-full flex-1 flex flex-row justify-between">
              <button id="0" class="celula flex-1 text-4xl border-[var(--borda)] border-r border-b flex justify-center items-center font-bold hover:bg-black/5 dark:hover:bg-white/5 transition"></button>
              <button id="1" class="celula flex-1 text-4xl border-[var(--borda)] border-r border-b border-l flex justify-center items-center font-bold hover:bg-black/5 dark:hover:bg-white/5 transition"></button>
              <button id="2" class="celula flex-1 text-4xl border-[var(--borda)] border-b border-l flex justify-center items-center font-bold hover:bg-black/5 dark:hover:bg-white/5 transition"></button>
            </div>
            
            <!-- Linha 2 -->
            <div class="w-full flex-1 flex flex-row justify-between">
              <button id="3" class="celula flex-1 text-4xl border-[var(--borda)] border-r border-t border-b flex justify-center items-center font-bold hover:bg-black/5 dark:hover:bg-white/5 transition"></button>
              <button id="4" class="celula flex-1 text-4xl border-[var(--borda)] border-r border-t border-b border-l flex justify-center items-center font-bold hover:bg-black/5 dark:hover:bg-white/5 transition"></button>
              <button id="5" class="celula flex-1 text-4xl border-[var(--borda)] border-t border-b border-l flex justify-center items-center font-bold hover:bg-black/5 dark:hover:bg-white/5 transition"></button>
            </div>
              
            <!-- Linha 3 -->
            <div class="w-full flex-1 flex flex-row justify-between">
              <button id="6" class="celula flex-1 text-4xl border-[var(--borda)] border-r border-t flex justify-center items-center font-bold hover:bg-black/5 dark:hover:bg-white/5 transition"></button>
              <button id="7" class="celula flex-1 text-4xl border-[var(--borda)] border-r border-t border-l flex justify-center items-center font-bold hover:bg-black/5 dark:hover:bg-white/5 transition"></button>
              <button id="8" class="celula flex-1 text-4xl border-[var(--borda)] border-t border-l flex justify-center items-center font-bold hover:bg-black/5 dark:hover:bg-white/5 transition"></button>
            </div>
          </div>
      </div>
    </div>
  
  <script src="scripts/jogo.js"></script>
</body>
</html>
